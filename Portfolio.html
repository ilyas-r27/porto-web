function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [active, setActive] = useState('home');
  const [pill, setPill] = useState({ left: 0, width: 0, opacity: 0 });
  const ulRef = useRef(null);
  const items = [
  { id: 'home', label: 'Home' },
  { id: 'about', label: 'About' },
  { id: 'projects', label: 'Projects' },
  { id: 'contact', label: 'Contact' }];

  useEffect(() => {
    const on = () => setScrolled(window.scrollY > 24);
    on();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);

  // Track which section is in view
  useEffect(() => {
    const sections = items.map((i) => document.getElementById(i.id)).filter(Boolean);
    const io = new IntersectionObserver((entries) => {
      // pick the entry closest to top that is intersecting
      const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActive(visible[0].target.id);
    }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
    sections.forEach((s) => io.observe(s));
    return () => io.disconnect();
  }, []);

  // Position the sliding glass pill behind active item
  useEffect(() => {
    const ul = ulRef.current;
    if (!ul) return;
    const link = ul.querySelector(`a[data-id="${active}"]`);
    if (!link) return;
    const ulRect = ul.getBoundingClientRect();
    const r = link.getBoundingClientRect();
    setPill({ left: r.left - ulRect.left, width: r.width, opacity: 1 });
  }, [active, scrolled]);

  const go = (e, id) => {
    e.preventDefault();
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' });
  };

  return (
    <nav className={"nav" + (scrolled ? " scrolled" : "")} style={{ overflow: 'hidden' }}>
      <ul ref={ulRef}>
        <span className="nav-pill" style={{ transform: `translateX(${pill.left}px)`, width: pill.width + 'px', opacity: pill.opacity }} aria-hidden="true"></span>
        {items.map((it) =>
        <li key={it.id}>
            <a href={`#${it.id}`} data-id={it.id} className={active === it.id ? 'is-active' : ''} onClick={(e) => go(e, it.id)}>{it.label}</a>
          </li>
        )}
      </ul>
    </nav>);

}

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const els = ref.current?.querySelectorAll('.reveal') || [];
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {if (en.isIntersecting) {en.target.classList.add('in');io.unobserve(en.target);}});
    }, { threshold: 0.12 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
  return ref;
}

function Projects() {
  const ref = useReveal();
  const railRef = useRef(null);
  const [edge, setEdge] = useState({ start: true, end: false });
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);

  const sync = () => {
    const el = railRef.current;
    if (!el) return;
    const max = el.scrollWidth - el.clientWidth;
    setEdge({ start: el.scrollLeft <= 4, end: el.scrollLeft >= max - 4 });
    const cards = [...el.querySelectorAll('.card')];
    if (!cards.length) return;
    const base = cards[0].offsetLeft;
    let near = 0, best = Infinity;
    cards.forEach((c, i) => {
      const d = Math.abs(c.offsetLeft - base - el.scrollLeft);
      if (d < best) { best = d; near = i; }
    });
    setIdx(el.scrollLeft >= max - 4 ? cards.length - 1 : near);
  };

  useEffect(() => {
    sync();
    const el = railRef.current;
    if (!el) return;
    el.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    return () => { el.removeEventListener('scroll', sync); window.removeEventListener('resize', sync); };
  }, []);

  const slide = (dir) => {
    const el = railRef.current;
    if (!el) return;
    const card = el.querySelector('.card');
    const step = card ? card.getBoundingClientRect().width + 18 : el.clientWidth * 0.8;
    const max = el.scrollWidth - el.clientWidth;
    const atEnd = el.scrollLeft >= max - 4;
    const atStart = el.scrollLeft <= 4;
    const next = dir > 0 ?
    atEnd ? 0 : Math.min(el.scrollLeft + step, max) :
    atStart ? max : Math.max(el.scrollLeft - step, 0);
    el.scrollTo({ left: next, behavior: 'smooth' });
  };

  const goTo = (i) => {
    const el = railRef.current;
    if (!el) return;
    const cards = [...el.querySelectorAll('.card')];
    if (!cards[i]) return;
    const max = el.scrollWidth - el.clientWidth;
    const target = cards[i].offsetLeft - cards[0].offsetLeft;
    el.scrollTo({ left: Math.min(target, max), behavior: 'smooth' });
  };

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => slide(1), 3600);
    return () => clearInterval(t);
  }, [paused]);

  return (
    <section id="projects" className="block" ref={ref}>
      <div className="section-head reveal">
        <h2>Selected <span style={{ fontStyle: 'italic' }}>work</span></h2>
        <div className="index mono">03 — Projects · {projects.length}</div>
      </div>

      <div className="projects-rail" onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
        <div className="rail-fade l" style={{ opacity: edge.start ? 0 : 1 }}></div>
        <div className="rail-fade r" style={{ opacity: edge.end ? 0 : 1 }}></div>
        <div className="projects" ref={railRef}>
          {projects.map((p, i) =>
          <a key={p.n} href={p.href} className={"card reveal d" + (i % 3 + 1)}>
              <div className="num">{p.n} / {String(projects.length).padStart(2, '0')}</div>
              <div className="visual">{p.img && <img src={p.img} alt={p.title} loading="lazy" />}<span>{p.visual}</span></div>
              <h3>{p.title}</h3>
              <p>{p.blurb}</p>
              <div className="tags">{p.tags.map((t) => <span key={t} className="tag">{t}</span>)}</div>
              <div className="arrow">
                <span>View case</span>
                <svg width="22" height="10" viewBox="0 0 22 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5h19m0 0L16 1m4 4l-4 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                {p.live && <span className="live-tag" onClick={(e) => { e.preventDefault(); e.stopPropagation(); window.open(p.live, '_blank', 'noopener'); }}>Live ↗</span>}
              </div>
            </a>
          )}
        </div>
      </div>

      <div className="rail-controls reveal">
        <button className="rail-btn" onClick={() => slide(-1)} aria-label="Previous project">
          <svg width="16" height="10" viewBox="0 0 22 10" fill="none"><path d="M21 5H2m0 0l4-4M2 5l4 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </button>
        <div className="rail-dots">
          {projects.map((p, i) =>
          <button key={p.n} className={"rail-dot" + (i === idx ? " on" : "")} onClick={() => goTo(i)} aria-label={"Go to " + p.title}></button>
          )}
        </div>
        <button className="rail-btn" onClick={() => slide(1)} aria-label="Next project">
          <svg width="16" height="10" viewBox="0 0 22 10" fill="none"><path d="M1 5h19m0 0L16 1m4 4l-4 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </button>
      </div>
    </section>);

        </div>
        <span>Designed &amp; built in Surabaya</span>
      </footer>
    </section>);
